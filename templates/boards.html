<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whiteboards - All Boards</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v={{ asset_version or '20261128' }}">
    <!-- Local CSS stylesheet -->
    <link rel="stylesheet" href="/static/css/style.css?v={{ asset_version or '20261121_10' }}">
    <style>
        html, body {
            overflow-y: auto !important;
            background: #f8fafc;
        }

        .boards-page-container {
            min-height: 100vh;
            background: #f8fafc;
            display: flex;
            flex-direction: column;
        }

        .boards-topbar {
            height: 60px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #e2e8f0;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .boards-topbar-inner {
            max-width: 1040px;
            height: 100%;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .boards-topbar-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .boards-topbar-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-icon-wrapper {
            position: relative;
        }

        .search-icon-wrapper svg {
            position: absolute;
            left: 11px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            pointer-events: none;
        }

        .boards-search-input {
            width: 200px;
            height: 34px;
            padding: 0 12px 0 32px;
            font-size: 13px;
            border: 1px solid #e2e8f0;
            border-radius: 999px;
            outline: none;
            background: #f8fafc;
            color: #0f172a;
            transition: all 0.15s ease;
        }

        .boards-search-input:focus {
            width: 230px;
            background: #ffffff;
            border-color: #93c5fd;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.08);
        }

        .btn-new-board-page {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 0 14px;
            height: 34px;
            background: #0f172a;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s ease, transform 0.1s ease;
        }

        .btn-new-board-page:hover {
            background: #1e293b;
            transform: translateY(-1px);
        }

        .btn-back-to-canvas {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 0 12px;
            height: 34px;
            background: transparent;
            color: #475569;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-back-to-canvas:hover {
            background: #ffffff;
            border-color: #cbd5e1;
            color: #0f172a;
        }

        .boards-main-content {
            flex: 1;
            max-width: 1040px;
            width: 100%;
            margin: 0 auto;
            padding: 36px 24px 56px;
        }

        .boards-section-header {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-bottom: 20px;
        }

        .boards-section-title {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #0f172a;
        }

        .boards-section-count {
            font-size: 13px;
            color: #94a3b8;
            font-weight: 500;
        }

        .boards-cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
        }

        .board-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
        }

        .board-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.06);
            border-color: #cbd5e1;
        }

        .board-card-preview {
            height: 112px;
            background-image: radial-gradient(rgba(148, 163, 184, 0.32) 1px, transparent 1px);
            background-size: 14px 14px;
            border-bottom: 1px solid #f1f5f9;
            position: relative;
        }

        .board-card-badge {
            position: absolute;
            bottom: 10px;
            right: 10px;
            padding: 2px 8px;
            font-size: 11px;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(4px);
            border: 1px solid #e2e8f0;
            border-radius: 999px;
            color: #64748b;
        }

        .board-card-body {
            padding: 13px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .board-card-info {
            min-width: 0;
            flex: 1;
        }

        .board-card-name {
            font-size: 14px;
            font-weight: 600;
            color: #0f172a;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 2px;
        }

        .board-card-meta {
            font-size: 12px;
            color: #94a3b8;
        }

        .board-icon-btn-group {
            display: flex;
            align-items: center;
            gap: 2px;
            opacity: 0.45;
            transition: opacity 0.15s ease;
        }

        .board-card:hover .board-icon-btn-group {
            opacity: 1;
        }

        .board-icon-btn {
            width: 28px;
            height: 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 7px;
            border: none;
            background: transparent;
            color: #64748b;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .board-icon-btn:hover {
            background: #f1f5f9;
            color: #0f172a;
        }

        .board-icon-btn.danger:hover {
            background: #fee2e2;
            color: #dc2626;
        }

        .create-card-placeholder {
            border: 1.5px dashed #cbd5e1;
            background: rgba(255, 255, 255, 0.5);
            min-height: 174px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            border-radius: 14px;
            transition: all 0.18s ease;
        }

        .create-card-placeholder:hover {
            border-color: #94a3b8;
            background: #ffffff;
            transform: translateY(-2px);
        }

        .create-icon-circle {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #f1f5f9;
            color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 500;
        }

        .create-card-text {
            font-size: 13px;
            font-weight: 600;
            color: #475569;
        }

        .boards-empty-state-full {
            text-align: center;
            padding: 48px 20px;
            color: #94a3b8;
            font-size: 13px;
        }
    </style>
</head>
<body class="boards-page-container">
    <header class="boards-topbar">
        <div class="boards-topbar-inner">
            <div class="boards-topbar-left">
                <a href="/boards" style="display: flex; align-items: center; gap: 8px; text-decoration: none; color: inherit;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                        <line x1="3" y1="9" x2="21" y2="9"/>
                        <line x1="9" y1="21" x2="9" y2="9"/>
                    </svg>
                    <span style="font-weight: 700; font-size: 15px; color: #0f172a; letter-spacing: -0.01em;">Whiteboard</span>
                </a>
            </div>

            <div class="boards-topbar-actions">
                <div class="search-icon-wrapper">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                    <input type="text" id="boards-page-search" class="boards-search-input" placeholder="Search...">
                </div>
                <button type="button" id="btn-import-board-header" class="btn-back-to-canvas" title="Import shared board (.wb.json / .json)">
                    Import
                </button>
                <input type="file" id="boards-page-import-input" accept=".json,.wb.json" style="display: none;">
                <button type="button" id="btn-create-board-header" class="btn-new-board-page">
                    <span>+</span> New Board
                </button>
            </div>
        </div>
    </header>

    <main class="boards-main-content">
        <div class="boards-section-header">
            <h1 class="boards-section-title">Boards</h1>
            <span class="boards-section-count" id="boards-count-label"></span>
        </div>

        <div class="boards-cards-grid" id="boards-grid">
            <!-- Dynamically populated from /api/boards -->
        </div>
    </main>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="toast-container"></div>

    <script>
        let allBoards = [];

        function showToast(message) {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('fade-out');
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        function formatTimeAgo(timestamp) {
            if (!timestamp) return 'Just now';
            const seconds = Math.floor(Date.now() / 1000) - timestamp;
            if (seconds < 60) return 'Just now';
            const minutes = Math.floor(seconds / 60);
            if (minutes < 60) return `${minutes}m ago`;
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return `${hours}h ago`;
            const days = Math.floor(hours / 24);
            return `${days}d ago`;
        }

        async function fetchBoards() {
            try {
                const res = await fetch('/api/boards');
                if (res.ok) {
                    allBoards = await res.json();
                    renderBoardsGrid();
                }
            } catch (err) {
                console.error('Failed to fetch boards:', err);
                showToast('Failed to load boards from server');
            }
        }

        function renderBoardsGrid() {
            const grid = document.getElementById('boards-grid');
            const searchInput = document.getElementById('boards-page-search');
            const query = (searchInput ? searchInput.value.trim().toLowerCase() : '');
            const countLabel = document.getElementById('boards-count-label');

            const filtered = allBoards.filter(b => b.name.toLowerCase().includes(query));
            if (countLabel) {
                countLabel.textContent = `${allBoards.length} board${allBoards.length === 1 ? '' : 's'}`;
            }

            grid.innerHTML = '';

            // Card 1: New Board placeholder
            const newCard = document.createElement('div');
            newCard.className = 'create-card-placeholder';
            newCard.title = 'Create a new whiteboard';
            newCard.innerHTML = `
                <div class="create-icon-circle">+</div>
                <div class="create-card-text">New Board</div>
            `;
            newCard.addEventListener('click', handleCreateBoard);
            grid.appendChild(newCard);

            if (filtered.length === 0 && query) {
                const emptyEl = document.createElement('div');
                emptyEl.className = 'boards-empty-state-full';
                emptyEl.style.gridColumn = '1 / -1';
                emptyEl.textContent = `No boards matching "${query}"`;
                grid.appendChild(emptyEl);
                return;
            }

            filtered.forEach(board => {
                const card = document.createElement('div');
                card.className = 'board-card';
                card.title = `Open ${board.name}`;

                const bg = board.bg_color || '#f8fafc';
                const objText = `${board.object_count} object${board.object_count === 1 ? '' : 's'}`;
                const timeText = formatTimeAgo(board.updated_at);

                card.innerHTML = `
                    <div class="board-card-preview" style="background-color: ${bg};">
                        <span class="board-card-badge">${objText}</span>
                    </div>
                    <div class="board-card-body">
                        <div class="board-card-info">
                            <div class="board-card-name">${board.name}</div>
                            <div class="board-card-meta">${timeText}</div>
                        </div>
                        <div class="board-icon-btn-group">
                            <button type="button" class="board-icon-btn btn-rename" title="Rename board">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                                </svg>
                            </button>
                            <button type="button" class="board-icon-btn danger btn-delete" title="Delete board">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="3 6 5 6 21 6"/>
                                    <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                `;

                card.addEventListener('click', () => {
                    window.location.href = `/board/${board.id}`;
                });

                // Rename
                card.querySelector('.btn-rename').addEventListener('click', (e) => {
                    e.stopPropagation();
                    handleRenameBoard(board);
                });

                // Delete
                card.querySelector('.btn-delete').addEventListener('click', (e) => {
                    e.stopPropagation();
                    handleDeleteBoard(board);
                });

                grid.appendChild(card);
            });
        }

        async function handleCreateBoard() {
            const name = prompt('Enter a name for the new whiteboard:', `Board ${allBoards.length + 1}`);
            if (name === null) return;
            const finalName = name.trim() || `Board ${allBoards.length + 1}`;

            try {
                const res = await fetch('/api/boards', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: finalName, bg_color: '#f8fafc' })
                });

                if (res.ok) {
                    const newBoard = await res.json();
                    showToast(`Created "${newBoard.name}"`);
                    window.location.href = `/board/${newBoard.id}`;
                } else {
                    showToast('Failed to create board');
                }
            } catch (err) {
                console.error(err);
                showToast('Error creating board');
            }
        }

        async function handleRenameBoard(board) {
            const newName = prompt(`Enter new name for "${board.name}":`, board.name);
            if (newName === null) return;
            const finalName = newName.trim();
            if (!finalName || finalName === board.name) return;

            try {
                const res = await fetch(`/api/boards/${board.id}/rename`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: finalName })
                });

                if (res.ok) {
                    showToast(`Renamed to "${finalName}"`);
                    fetchBoards();
                } else {
                    showToast('Failed to rename board');
                }
            } catch (err) {
                console.error(err);
                showToast('Error renaming board');
            }
        }

        async function handleDeleteBoard(board) {
            if (allBoards.length <= 1) {
                showToast('Cannot delete the only remaining board');
                return;
            }

            if (!confirm(`Are you sure you want to permanently delete "${board.name}"?`)) return;

            try {
                const res = await fetch(`/api/boards/${board.id}`, { method: 'DELETE' });
                if (res.ok) {
                    showToast(`Deleted "${board.name}"`);
                    fetchBoards();
                } else {
                    showToast('Failed to delete board');
                }
            } catch (err) {
                console.error(err);
                showToast('Error deleting board');
            }
        }

        document.getElementById('btn-create-board-header').addEventListener('click', handleCreateBoard);
        document.getElementById('boards-page-search').addEventListener('input', renderBoardsGrid);

        const btnImportHeader = document.getElementById('btn-import-board-header');
        const importInput = document.getElementById('boards-page-import-input');
        if (btnImportHeader && importInput) {
            btnImportHeader.addEventListener('click', () => {
                importInput.value = '';
                importInput.click();
            });
            importInput.addEventListener('change', (e) => {
                const file = e.target.files && e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = async (ev) => {
                    let parsedData;
                    try {
                        parsedData = JSON.parse(ev.target.result);
                    } catch (err) {
                        showToast('Import failed: File is not valid JSON');
                        return;
                    }
                    const isImportable = parsedData && typeof parsedData === 'object' && !Array.isArray(parsedData) && (Array.isArray(parsedData.objects) || Array.isArray(parsedData.slides));
                    if (!isImportable) {
                        showToast('Import failed: Not a valid whiteboard file');
                        return;
                    }
                    const boardName = (parsedData.boardName && typeof parsedData.boardName === 'string' && parsedData.boardName.trim())
                        ? parsedData.boardName.trim()
                        : (file.name.replace(/\.wb\.json$/i, '').replace(/\.[^/.]+$/, '').trim() || 'Imported Board');
                    const importedBg = (parsedData.bgColor && typeof parsedData.bgColor === 'string') ? parsedData.bgColor : '#f8fafc';
                    try {
                        const res = await fetch('/api/boards', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                name: boardName,
                                bg_color: importedBg,
                                data: JSON.stringify(parsedData)
                            })
                        });
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        const created = await res.json();
                        showToast(`Imported "${boardName}"`);
                        window.location.href = `/board/${created.id}`;
                    } catch (err) {
                        console.error(err);
                        showToast('Error importing board');
                    }
                };
                reader.readAsText(file);
            });
        }

        // Boot
        fetchBoards();
    </script>
</body>
</html>
