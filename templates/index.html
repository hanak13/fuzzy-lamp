<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whiteboard App</title>
    <!-- Local CSS stylesheet -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- Top Toolbar -->
    <header id="toolbar">
        <div class="toolbar-brand">
            <span class="brand-icon">✏️</span>
            <span class="brand-name">Whiteboard</span>
        </div>

        <div class="toolbar-separator"></div>

        <!-- Mode Selection: Select, Pan, Pen, Highlighter, Eraser, Text -->
        <div class="toolbar-group" role="group" aria-label="Drawing Tools">
            <button id="btn-select" class="btn tool-btn active" title="Select / Move / Resize / Delete (V)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 3l7 18 3-7 7-3L3 3z"/>
                </svg>
                <span>Select (V)</span>
            </button>
            <button id="btn-pan" class="btn tool-btn" title="Pan / Hand tool (H or hold Spacebar)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 11V6a2 2 0 0 0-4 0v4"/>
                    <path d="M14 10V4a2 2 0 0 0-4 0v6"/>
                    <path d="M10 10.5V6a2 2 0 0 0-4 0v8"/>
                    <path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/>
                </svg>
                <span>Pan (H)</span>
            </button>
            <button id="btn-pen" class="btn tool-btn" title="Freehand Pen (P)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>
                    <path d="m15 5 4 4"/>
                </svg>
                <span>Pen (P)</span>
            </button>
            <button id="btn-highlighter" class="btn tool-btn" title="Highlighter (K)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m9 11-6 6v3h3l6-6"/>
                    <path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/>
                </svg>
                <span>Highlighter</span>
            </button>
            <button id="btn-eraser" class="btn tool-btn" title="Eraser (E)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/>
                    <path d="M22 21H7"/>
                    <path d="m5 11 9 9"/>
                </svg>
                <span>Eraser (E)</span>
            </button>
            <button id="btn-text" class="btn tool-btn" title="Text Tool (T) - Click anywhere to type">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="4 7 4 4 20 4 20 7"/>
                    <line x1="9" y1="20" x2="15" y2="20"/>
                    <line x1="12" y1="4" x2="12" y2="20"/>
                </svg>
                <span>Text (T)</span>
            </button>
            <button id="btn-sticky" class="btn tool-btn" title="Sticky Note (S) - Click on canvas to place">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15.5 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8.5L15.5 3Z"/>
                    <path d="M15 3v6h6"/>
                </svg>
                <span>Note (S)</span>
            </button>
        </div>

        <div class="toolbar-separator"></div>

        <!-- Tool Properties: Color, Size, Font Formatting -->
        <div id="tool-properties" class="toolbar-group">
            <!-- Color Picker -->
            <div id="prop-color-group" class="prop-item" title="Color">
                <label for="color-picker" class="color-picker-label" title="Choose color">
                    <input type="color" id="color-picker" value="#1e293b">
                    <span id="color-preview" class="color-swatch-circle" style="background-color: #1e293b;"></span>
                </label>
            </div>

            <!-- Sticky Note Colors: Yellow, Pink, Green, Blue -->
            <div id="prop-sticky-group" class="prop-item" title="Sticky Note Color">
                <span class="prop-label">Note</span>
                <div class="sticky-color-swatches">
                    <button type="button" class="sticky-color-btn active" data-color="yellow" style="background-color: #fef08a;" title="Yellow Note"></button>
                    <button type="button" class="sticky-color-btn" data-color="pink" style="background-color: #fbcfe8;" title="Pink Note"></button>
                    <button type="button" class="sticky-color-btn" data-color="green" style="background-color: #bbf7d0;" title="Green Note"></button>
                    <button type="button" class="sticky-color-btn" data-color="blue" style="background-color: #bfdbfe;" title="Blue Note"></button>
                </div>
            </div>
            <div id="prop-size-group" class="prop-item" title="Stroke / Eraser Width">
                <span class="prop-label">Size</span>
                <select id="select-stroke-size" class="prop-select">
                    <option value="2">2px</option>
                    <option value="4" selected>4px</option>
                    <option value="8">8px</option>
                    <option value="16">16px</option>
                    <option value="24">24px</option>
                    <option value="36">36px</option>
                </select>
            </div>

            <!-- Text Controls: Font Size, Bold, Italic -->
            <div id="prop-text-group" class="prop-item-group">
                <div class="prop-item" title="Font Size">
                    <span class="prop-label">Font</span>
                    <select id="select-font-size" class="prop-select">
                        <option value="16">16px</option>
                        <option value="20">20px</option>
                        <option value="24" selected>24px</option>
                        <option value="32">32px</option>
                        <option value="40">40px</option>
                        <option value="48">48px</option>
                        <option value="64">64px</option>
                    </select>
                </div>
                <button id="btn-bold" class="btn prop-btn" title="Toggle Bold">
                    <b>B</b>
                </button>
                <button id="btn-italic" class="btn prop-btn" title="Toggle Italic">
                    <i>I</i>
                </button>
            </div>
        </div>

        <div class="toolbar-separator"></div>

        <!-- Delete Selected Object(s) -->
        <div class="toolbar-group">
            <button id="btn-delete" class="btn action-btn btn-danger" title="Delete selected object(s) (Delete / Backspace)" disabled>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"/>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                </svg>
                <span>Delete</span>
            </button>
        </div>

        <div class="toolbar-separator"></div>

        <!-- History: Undo / Redo -->
        <div class="toolbar-group">
            <button id="btn-undo" class="btn action-btn" title="Undo (Ctrl+Z)" disabled>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 7v6h6"/>
                    <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/>
                </svg>
                <span>Undo</span>
            </button>
            <button id="btn-redo" class="btn action-btn" title="Redo (Ctrl+Y)" disabled>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 7v6h-6"/>
                    <path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"/>
                </svg>
                <span>Redo</span>
            </button>
        </div>

        <div class="toolbar-separator"></div>

        <!-- Testing helpers for Phase 1 -->
        <div class="toolbar-group">
            <button id="btn-add-box" class="btn action-btn" title="Add a sample shape to test canvas & undo/redo">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2"/>
                </svg>
                <span>+ Add Box</span>
            </button>
            <button id="btn-clear" class="btn action-btn btn-danger" title="Clear Canvas">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"/>
                    <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
                </svg>
                <span>Clear</span>
            </button>
        </div>
    </header>

    <!-- Canvas Container -->
    <main id="canvas-container">
        <canvas id="whiteboard-canvas"></canvas>
    </main>

    <!-- Bottom-right Zoom Widget -->
    <div id="zoom-widget">
        <button id="btn-zoom-out" class="zoom-btn" title="Zoom Out (-)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
        </button>
        <span id="zoom-percentage" title="Click to reset to 100%">100%</span>
        <button id="btn-zoom-in" class="zoom-btn" title="Zoom In (+)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="12" y1="5" x2="12" y2="19"/>
                <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
        </button>
        <button id="btn-reset-view" class="zoom-btn text-btn" title="Reset View & Zoom">Reset</button>
    </div>

    <!-- Scripts (Offline Fabric.js vendor script and custom whiteboard script) -->
    <script src="/static/vendor/fabric.min.js"></script>
    <script src="/static/js/whiteboard.js"></script>
</body>
</html>
